services:
  mysql:
    image: mysql:8.0
    container_name: biblioteca_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: biblioteca
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build: .
    container_name: biblioteca_php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_NAME: biblioteca
      DB_USER: root
      DB_PASS: rootpass

volumes:
  db_data:
